source:
  class_path: pest.FitsDataset
  init_args:
    path: /urz/gpuscratch/its/doserbd/data/SKIRT_synthetic_images/fits
    columns:
      - image
      - simulation
      - snapshot
      - subhalo_id

transformations:
  - column: image
    transformations:
      - class_path: pest.CreateNormalizedRGBColors
        init_args:
            stretch: 0.9
            range: 5
            lower_limit: 0.001
            channel_combinations: [[2, 3], [1, 0], [0]]
            scalers: [0.7, 0.5, 1.3]
      - class_path: pest.RemoveInvalidImages
      - class_path: pest.AlignImageHorizontally
      - class_path: pest.CropQuadratic
      - class_path: pest.ResizeImage
      - class_path: pest.ReflectionalInvariance
      - class_path: pest.MinMaxNormalize
        init_args:
          feature_range: [0, 1]

target:
  class_path: pest.ParquetWriter
