source:
  class_path: pest.IllustrisExtractor
  init_args:
    simulation_path: /home/doserbd/data/illustris/Illustris-3
    simulation: TNG50
    snapshot: 99
    objects: centrals
    component:
      - name: stars
        fields:
          - masses
          - positions
          - velocities
          - ages
          - metallicities
        selector:
          type: stellar mass
          min: 5.0e+10
          max: 5.2e+10
      - name: gas
        fields:
          - masses
          - positions
      - name: dark_matter
        fields:
          - masses
          - positions

target:
  class_path: pest.ParquetWriter
  init_args:
    output_directory: /home/doserbd/data/illustris/parquet/point-cloud
    compression: snappy
    chunk_size: 1000

    columns:
      - name: skirt
        generator:
          class_path: pest.SKIRTGenerator
          init_args:
            image_size: 128

      - name: image
        generator:
          class_path: pest.OpticalImageGenerator
          init_args:
            image_size: 128
            smoothing: 0.0
            fov: scaled
            image_scale: log
            orientation: original

      - name: point-cloud
        generator:
          class_path: pest.PointCloudGenerator
          init_args:
            image_size: 128
            image_depth: 1.0
            smoothing: 0.0
            fov: scaled
            image_scale: log
            orientation: original
