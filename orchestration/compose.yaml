# Local Airflow for the PEST pipelines on rootless Podman: LocalExecutor with a
# Postgres metadata database, all on one host. Adapted from the official Airflow
# 3.3.2 docker-compose.yaml, without Celery and Redis. See docs/airflow.md.
#
#   cp .env.example .env   # and fill it in
#   podman compose build
#   podman compose run --rm airflow-init
#   podman compose up -d
---
x-airflow-common:
  &airflow-common
  build:
    context: ..
    dockerfile: orchestration/Containerfile
  image: localhost/pest-airflow:3.3.2
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in orchestration/.env}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # LocalExecutor starts this many worker processes up front.
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-8}
    PEST_POOL: pest
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ../pipelines:/opt/pest/pipelines:ro
    - ${PEST_HOST_DATA_DIR:-../data}:/opt/airflow/data
    - ${PEST_HOST_OUTPUT_DIR:-../output}:/opt/airflow/output
  # Run as the image's `airflow` user (50000:0) and map it to your own user, so
  # that files written to the mounted directories belong to you.
  user: "50000:0"
  userns_mode: "keep-id:uid=50000"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  # With the LocalExecutor the tasks, and so the PEST pipelines, run in this
  # container: it is the only one that gets the API tokens, and it needs the
  # CPUs and memory for the pipeline runs.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      <<: *airflow-common-env
      ILLUSTRIS_API_KEY: ${ILLUSTRIS_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  # Migrates the database and creates the admin user and the `pest` pool. Run it
  # with `podman compose run --rm airflow-init` before the first `up`: the other
  # services don't depend on it, because podman-compose would make them require
  # this one-shot container. It also runs on every `up`, where it changes nothing.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        /entrypoint airflow version
        _AIRFLOW_DB_MIGRATE=false _AIRFLOW_WWW_USER_CREATE=false \
          /entrypoint airflow pools set pest "${PEST_POOL_SLOTS:-1}" "PEST pipeline runs"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

volumes:
  postgres-db-volume:
